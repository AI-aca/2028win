<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2028 영재학교반 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loadingSpinner" class="hidden"><div class="spinner"></div></div>
  <div id="toastContainer" class="toast-container"></div>

  <div class="app-container">
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="https://drive.google.com/uc?export=view&id=1L89-Js-em1jLGxANEA6tOCDTiQ1oOzD0" alt="Weizmann Logo" class="site-logo">
          <span class="logo-text">2028 영재학교<br>주말특강 관리</span>
        </div>
      </div>
      
      <ul class="nav-menu accordion-menu">
        <li class="nav-item single-item" data-target="view-preschedule">
          <span class="icon">📅</span>
          <span class="text">사전 준비일정</span>
        </li>
        <li class="nav-item single-item" data-target="view-curriculum">
          <span class="icon">📚</span>
          <span class="text">수업 진도계획</span>
        </li>
        <li class="nav-item single-item" data-target="view-timetable">
          <span class="icon">⏰</span>
          <span class="text">시간표 관리</span>
        </li>
        <li class="nav-separator" style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 15px 0;"></li>
        <li class="nav-item single-item" data-target="view-student">
          <span class="icon">🎓</span>
          <span class="text">학생 정보</span>
        </li>
        <li class="nav-item single-item" data-target="view-instructor">
          <span class="icon">👨‍🏫</span>
          <span class="text">강사 정보</span>
        </li>
        <li class="nav-item link-item" onclick="window.open('https://chat.google.com/u/0/app/chat/AAQAx1Tqj3c', '_blank')">
          <span class="icon">💬</span>
          <span class="text">구글 채팅</span>
        </li>
      </ul>
      <div class="weizmann-signature">Weizmann</div>
    </nav>

    <main class="main-content">
      <header class="top-header">
        <h1 id="pageTitle">대시보드</h1>
      </header>

      <div class="content-wrapper">
        <div id="view-dashboard" class="view-section active data-view">
          <div class="glass-panel text-center" style="margin-top: 100px;">
            <h2>환영합니다!</h2>
            <p class="empty-msg">좌측 메뉴에서 항목을 선택해 주세요.</p>
          </div>
        </div>

        <div id="view-preschedule" class="view-section hidden data-view">
          <div class="glass-panel">
            <div class="panel-header">
              <h2>사전 준비일정</h2>
              <button class="btn btn-primary" onclick="app.addRow('preschedule')">+</button>
            </div>
            <div class="panel-content table-container">
              <table class="excel-table">
                <thead><tr><th>일자</th><th>내용</th><th>비고</th><th style="width: 60px;">삭제</th></tr></thead>
                <tbody id="tbody-preschedule"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="view-curriculum" class="view-section hidden data-view">
          <div class="glass-panel">
            <div class="panel-header">
              <h2>수업 진도계획</h2>
              <div>
                <button class="btn btn-primary" onclick="app.addRow('curriculum')">+</button>
                <button class="btn btn-primary" style="background:#06b6d4;" onclick="app.addColumn('curriculum')">+</button>
              </div>
            </div>
            <div class="panel-content table-container">
              <table class="excel-table" id="table-curriculum">
                <!-- pivot generated -->
              </table>
            </div>
          </div>
        </div>

        <div id="view-timetable" class="view-section hidden data-view">
          <div class="glass-panel">
            <div class="panel-header">
              <h2>시간표 관리</h2>
              <div>
                <button class="btn btn-primary" onclick="app.addRow('timetable')">+</button>
                <button class="btn btn-primary" style="background:#06b6d4;" onclick="app.addColumn('timetable')">+</button>
              </div>
            </div>
            <div class="panel-content table-container">
              <table class="excel-table" id="table-timetable">
                <!-- pivot generated -->
              </table>
            </div>
          </div>
        </div>

        <div id="view-student" class="view-section hidden data-view">
          <div class="glass-panel">
            <div class="panel-header">
              <h2>학생 정보</h2>
              <button class="btn btn-primary" onclick="app.addRow('student')">+</button>
            </div>
            <div class="panel-content table-container">
              <table class="excel-table">
                <thead><tr><th>이름</th><th>학교</th><th>학년</th><th>학부모연락처</th><th>학생연락처</th><th>비고</th><th style="width: 60px;">삭제</th></tr></thead>
                <tbody id="tbody-student"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="view-instructor" class="view-section hidden data-view">
          <div class="glass-panel">
            <div class="panel-header">
              <h2>강사 정보</h2>
              <button class="btn btn-primary" onclick="app.addRow('instructor')">+</button>
            </div>
            <div class="panel-content table-container">
              <table class="excel-table">
                <thead><tr><th>강사명</th><th>과목</th><th>세부과목</th><th>연락처</th><th>지메일</th><th>비고</th><th style="width: 60px;">삭제</th></tr></thead>
                <tbody id="tbody-instructor"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-container" class="modal-overlay hidden">
    <div id="generic-modal" class="modal-content hidden">
      <div class="modal-header">
        <h3 id="generic-modal-title">새 항목 추가</h3>
        <button class="close-btn" onclick="app.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="generic-modal-body">
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="app.closeModal()">취소</button>
        <button class="btn btn-primary" onclick="app.saveModalData()">저장</button>
      </div>
    </div>
  </div>

  <!-- Floating Toolbar -->
  <div id="rich-toolbar" class="rich-toolbar hidden">
    <button class="toolbar-btn" onmousedown="app.execCmd('bold', event)" title="굵게"><b>B</b></button>
    <button class="toolbar-btn" onmousedown="app.execCmd('italic', event)" title="기울임"><i>I</i></button>
    <button class="toolbar-btn" onmousedown="app.execCmd('underline', event)" title="밑줄"><u>U</u></button>
    <button class="toolbar-btn" onmousedown="app.execCmd('foreColor', event, 'red')" title="빨간색 글씨" style="color:red; font-weight:bold;">A</button>
    <button class="toolbar-btn" onmousedown="app.execCmd('foreColor', event, '#06b6d4')" title="파란색 글씨" style="color:#06b6d4; font-weight:bold;">A</button>
    <button class="toolbar-btn" onmousedown="app.execCmd('foreColor', event, '#e2e8f0')" title="기본색 글씨" style="color:#e2e8f0; font-weight:bold;">A</button>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <ul>
      <li onclick="app.ctxInsertRowAbove()">행 위에 삽입</li>
      <li onclick="app.ctxInsertRowBelow()">행 아래에 삽입</li>
      <li class="menu-separator"></li>
      <li class="text-danger" onclick="app.ctxDeleteRow()">행 삭제</li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
